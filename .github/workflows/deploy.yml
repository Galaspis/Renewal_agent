name: Deploy renewals.gallab.top
# Push to master → the server rebuilds the container. Needs repo secrets VPS_SSH_KEY and VPS_HOST.
# Secrets for the app itself live only in /srv/renewals/.env on the server; data in /srv/renewals/data.
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join the private network (Tailscale)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: SSH setup
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Sync source
        env: { H: "${{ secrets.VPS_HOST }}" }
        run: rsync -az --delete --exclude .git --exclude node_modules --exclude .next --exclude data --exclude '.env*' --exclude tsconfig.tsbuildinfo ./ deploy@$H:/srv/renewals/app/
      - name: Rebuild container
        env: { H: "${{ secrets.VPS_HOST }}" }
        run: ssh deploy@$H 'cd /srv/renewals && docker compose up -d --build 2>&1 | tail -3 && docker image prune -f >/dev/null'
      - name: Caddy site
        env: { H: "${{ secrets.VPS_HOST }}" }
        run: |
          scp -q deploy/renewals.caddy deploy@$H:/tmp/renewals.caddy
          ssh deploy@$H 'sudo /usr/local/bin/caddy-site-install renewals'
      - name: Smoke test
        env: { H: "${{ secrets.VPS_HOST }}" }
        run: |
          ssh deploy@$H 'sleep 6; curl -s -o /dev/null -m 10 -H "Remote-Email: ci@gallab.top" -w "app with hub identity: %{http_code}\n" http://127.0.0.1:3000/'
          code=$(curl -s -o /dev/null -m 15 -w "%{http_code}" https://renewals.gallab.top/)
          echo "renewals.gallab.top → $code (401 = login gate, expected)"
          test "$code" = "401"
